# Render Blueprint — production template (Pro web + worker + MySQL + Redis)
# Docs: docs/DEPLOY-RENDER.md

databases:
  - name: ecommerce-mysql
    plan: starter
    databaseName: ecommerce
    user: ecommerce

services:
  - type: web
    name: ecommerce-web
    runtime: docker
    plan: pro
    region: oregon
    healthCheckPath: /up
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: E-Commerce
      - key: STORE_NAME
        value: E-Commerce
      - key: CURRENCY
        value: USD
      - key: CURRENCY_SYMBOL
        value: $
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: ecommerce-mysql
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ecommerce-mysql
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: ecommerce-mysql
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: ecommerce-mysql
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ecommerce-mysql
          property: password
      - key: REDIS_CLIENT
        value: predis
      - key: REDIS_URL
        sync: false
      - key: SESSION_DRIVER
        value: redis
      - key: CACHE_STORE
        value: redis
      - key: QUEUE_CONNECTION
        value: redis
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: RENDER
        value: "true"
      - key: BROADCAST_CONNECTION
        value: pusher
      - key: PUSHER_APP_ID
        sync: false
      - key: PUSHER_APP_KEY
        sync: false
      - key: PUSHER_APP_SECRET
        sync: false
      - key: PUSHER_APP_CLUSTER
        sync: false
      - key: PUSHER_SCHEME
        value: https
      - key: PUSHER_PORT
        value: "443"
      - key: VITE_PUSHER_APP_KEY
        sync: false
      - key: VITE_PUSHER_APP_CLUSTER
        sync: false
      - key: VITE_PUSHER_SCHEME
        value: https
      - key: VITE_APP_NAME
        value: E-Commerce
      - key: FILESYSTEM_DISK
        value: s3
      - key: FILESYSTEM_PRODUCT_DISK
        value: s3
      - key: FILESYSTEM_PRIVATE_DISK
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: AWS_BUCKET
        sync: false
      - key: MAIL_MAILER
        value: log

  - type: worker
    name: ecommerce-worker
    runtime: docker
    plan: pro
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: php artisan queue:work redis --sleep=1 --tries=3 --timeout=120
    autoDeploy: true
    envVars:
      - fromService:
          name: ecommerce-web
          type: web
          envVarKey: APP_KEY
      - fromService:
          name: ecommerce-web
          type: web
          envVarKey: DB_CONNECTION
      - fromService:
          name: ecommerce-web
          type: web
          envVarKey: DB_HOST
      - fromService:
          name: ecommerce-web
          type: web
          envVarKey: DB_PORT
      - fromService:
          name: ecommerce-web
          type: web
          envVarKey: DB_DATABASE
      - fromService:
          name: ecommerce-web
          type: web
          envVarKey: DB_USERNAME
      - fromService:
          name: ecommerce-web
          type: web
          envVarKey: DB_PASSWORD
      - fromService:
          name: ecommerce-web
          type: web
          envVarKey: REDIS_URL
      - fromService:
          name: ecommerce-web
          type: web
          envVarKey: QUEUE_CONNECTION
      - key: APP_ENV
        value: production
