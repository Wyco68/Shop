# Render Blueprint — FREE TIER template (single free web service, no worker, no managed DB/Redis).
# Docs: README.md → Deployment, Production Security Checklist
#
# Render has no managed MySQL (only Postgres) and no permanent free database, so this blueprint does
# NOT provision a database — point it at an external MySQL/Postgres you already host (e.g. a free-tier
# instance from another provider) by filling in DB_* below after the first deploy.
#
# Free-tier tradeoffs vs. a paid setup:
#   - No Redis: SESSION_DRIVER=file, CACHE_STORE=database, QUEUE_CONNECTION=sync (jobs run inline,
#     in-request, instead of in a background worker).
#   - No worker service: nothing runs the scheduler (routes/console.php's daily notification prune)
#     automatically. Trigger it manually (`render run` / dashboard shell) or upgrade to a paid plan
#     and add a worker/cron service running `php artisan schedule:work`.
#   - Free web services spin down after inactivity and have ephemeral disk: local file uploads
#     (FILESYSTEM_DISK=local) are lost on every redeploy. Set FILESYSTEM_DISK/FILESYSTEM_PRODUCT_DISK/
#     FILESYSTEM_PRIVATE_DISK=s3 and fill in AWS_* if you need uploads to survive redeploys.
# APP_DEBUG=false below is required — never set true in production.

services:
  - type: web
    name: ecommerce-web
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /up
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: E-Commerce
      - key: STORE_NAME
        value: E-Commerce
      - key: CURRENCY
        value: USD
      - key: CURRENCY_SYMBOL
        value: $
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      # External database — Render has no free managed MySQL/Postgres. Set these to your own
      # MySQL (DB_CONNECTION=mysql, matches the app's installed pdo_mysql driver) or Postgres
      # (DB_CONNECTION=pgsql) instance.
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: RENDER
        value: "true"
      # Real-time notifications disabled by default (no paid add-on required). Pusher has its own
      # free tier (200k msgs/day) if you want this — set BROADCAST_CONNECTION=pusher and fill in
      # PUSHER_*/VITE_PUSHER_* below.
      - key: BROADCAST_CONNECTION
        value: log
      - key: PUSHER_APP_ID
        sync: false
      - key: PUSHER_APP_KEY
        sync: false
      - key: PUSHER_APP_SECRET
        sync: false
      - key: PUSHER_APP_CLUSTER
        sync: false
      - key: PUSHER_SCHEME
        value: https
      - key: PUSHER_PORT
        value: "443"
      - key: VITE_PUSHER_APP_KEY
        sync: false
      - key: VITE_PUSHER_APP_CLUSTER
        sync: false
      - key: VITE_PUSHER_SCHEME
        value: https
      - key: VITE_APP_NAME
        value: E-Commerce
      # Local disk by default — uploads are lost on every redeploy (see note above). Switch to s3
      # for persistence; AWS S3 has its own free tier for new accounts.
      - key: FILESYSTEM_DISK
        value: local
      - key: FILESYSTEM_PRODUCT_DISK
        value: public
      - key: FILESYSTEM_PRIVATE_DISK
        value: private
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: AWS_BUCKET
        sync: false
      - key: MAIL_MAILER
        value: log
