name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/wyco68/shop

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # VITE_* build args live only in .env.vps on the VPS (single source of
      # truth, no duplicating them into GitHub Variables to drift out of sync).
      # Fetched fresh over SSH for every build, using the same deploy key the
      # deploy job below already needs.
      - name: Fetch VITE_* build args from the VPS
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null /tmp/deploy_key
          echo "$SSH_KEY" > /tmp/deploy_key
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "grep -E '^VITE_' ~/server/apps/Shop/.env.vps || true" > /tmp/vite.env
          rm -f /tmp/deploy_key
          cat /tmp/vite.env >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/vps/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_REVERB_APP_KEY=${{ env.VITE_REVERB_APP_KEY }}
            VITE_REVERB_HOST=${{ env.VITE_REVERB_HOST }}
            VITE_REVERB_PORT=${{ env.VITE_REVERB_PORT }}
            VITE_REVERB_SCHEME=${{ env.VITE_REVERB_SCHEME }}
            VITE_PUSHER_APP_KEY=${{ env.VITE_PUSHER_APP_KEY }}
            VITE_PUSHER_APP_CLUSTER=${{ env.VITE_PUSHER_APP_CLUSTER }}
            VITE_PUSHER_SCHEME=${{ env.VITE_PUSHER_SCHEME }}
            VITE_APP_NAME=${{ env.VITE_APP_NAME }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 30s
          command_timeout: 10m
          envs: GHCR_TOKEN,GHCR_ACTOR
          script: |
            set -euo pipefail
            cd ~/server/apps/Shop

            echo "== Fetching origin/main =="
            git fetch origin
            # Hard reset, not --ff-only: this checkout only ever exists to mirror
            # origin/main for deploys, so it should never diverge or need manual
            # intervention. Untracked ops-only files (.env.vps,
            # docker-compose.vps.proxy.yml, .env.vps.bak.*) are unaffected by reset.
            git reset --hard origin/main

            echo "== Pulling built image (no build on this box) =="
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            docker compose -f docker-compose.vps.yml --env-file .env.vps pull app

            echo "== Recreating containers =="
            docker compose -f docker-compose.vps.yml -f docker-compose.vps.proxy.yml --env-file .env.vps up -d app worker scheduler redis

            echo "== Waiting for shop-app-1 to report healthy =="
            healthy=""
            for i in $(seq 1 30); do
              status=$(docker inspect --format='{{.State.Health.Status}}' shop-app-1 2>/dev/null || echo "starting")
              if [ "$status" = "healthy" ]; then
                healthy=1
                echo "app is healthy"
                break
              fi
              sleep 2
            done
            if [ -z "$healthy" ]; then
              echo "app did not become healthy in time -- recent logs:"
              docker logs --tail 100 shop-app-1
              exit 1
            fi

            echo "== Smoke test through Caddy =="
            if docker exec caddy wget -qO- --header='Host: carpart.wyco-dev.com' -T 15 http://shop-app-1:8080/up | grep -qi 'application up'; then
              echo "site reachable through Caddy"
            else
              echo "site NOT reachable through Caddy after deploy"
              exit 1
            fi
