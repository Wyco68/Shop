# Self-hosted VPS production stack: app + queue worker + scheduler + reverb + MySQL + Redis.
# TLS termination is handled by Nginx running on the host (not in this stack) — see
# DEPLOYMENT.md "Phase 6". The "app" and "reverb" containers each publish a port on localhost
# only, for Nginx to reverse_proxy/upgrade into.
# Usage:
#   cp .env.vps.example .env.vps
#   # edit .env.vps: set APP_URL, DB_PASSWORD, generate APP_KEY (see README "VPS Deployment")
#   docker compose -f docker-compose.vps.yml --env-file .env.vps build app   # build once
#   docker compose -f docker-compose.vps.yml --env-file .env.vps up -d      # worker/scheduler reuse it
#
# Only "app" has a `build:` block — worker/scheduler just reference its image tag. Giving all three
# a `build:` (even via a shared YAML anchor) makes Compose build the same Dockerfile three times in
# parallel, which can starve a small VPS of CPU/RAM during the PHP-extension-compile + npm build step.
x-app-build: &app-build
  context: .
  dockerfile: docker/vps/Dockerfile
  args:
    VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY:-}
    VITE_REVERB_HOST: ${VITE_REVERB_HOST:-}
    VITE_REVERB_PORT: ${VITE_REVERB_PORT:-443}
    VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}
    VITE_APP_NAME: ${VITE_APP_NAME:-E-Commerce}

services:
  app:
    image: carpart-app:latest
    build: *app-build
    command: ["serve"]
    env_file: .env.vps
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - app-storage:/var/www/html/storage/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: carpart-app:latest
    command: ["worker"]
    env_file: .env.vps
    volumes:
      - app-storage:/var/www/html/storage/app
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    image: carpart-app:latest
    command: ["scheduler"]
    env_file: .env.vps
    volumes:
      - app-storage:/var/www/html/storage/app
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  reverb:
    image: carpart-app:latest
    command: ["reverb"]
    env_file: .env.vps
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-ecommerce}
      MYSQL_USER: ${DB_USERNAME:-ecommerce}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  app-storage:
